name: Staging smoke check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: staging
    env:
      LAB_STAGING_URL: ${{ vars.LAB_STAGING_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - run: node tests/performance/check-staging.mjs
