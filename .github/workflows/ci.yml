name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript and build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run API tests
        run: npm run test:api

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Store browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  mongo-browser:
    name: Browser tests with MongoDB
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Verify Atlas storage flows with isolated MongoDB
        run: npm run test:e2e -- account-history.spec.ts
        env:
          LAB_E2E_HISTORY_MONGO_PORT: ${{ job.services.mongo.ports[27017] }}
          LAB_DATASET_MAX_FILES: '2'
      - name: Store MongoDB browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mongo-browser-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
