name: dimension-lab

services:
  mongodb:
    image: mongo:7.0
    container_name: dimension-lab-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 }).ok"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mongodb-data:
    external: true
    name: dimension-lab-mongodb-data
