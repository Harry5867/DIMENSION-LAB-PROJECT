# ==============================================================================
# NGINX PRODUCTION CONFIGURATION
# Hệ thống 3D Interactive High-Dimensional Data Explorer
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # 1. GHI LOG & TỐI ƯU HÓA HIỆU NĂNG CƠ BẢN
    # --------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k flush=2m;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off; # Ẩn phiên bản Nginx để bảo mật

    # --------------------------------------------------------------------------
    # 2. CHỐNG TẤN CÔNG DDOS & TREO KẾT NỐI (SLOWLORIS DEFENSE)
    # --------------------------------------------------------------------------
    client_body_timeout 10s;       # Chống client truyền body chậm gây nghẽn RAM
    client_header_timeout 10s;     # Chống Slowloris treo header
    keepalive_timeout 30s;
    send_timeout 10s;
    client_max_body_size 50M;      # Giới hạn kích thước tệp tải lên CSV

    # Vùng nhớ lưu trữ IP để kiểm soát tần suất request (Rate Limiting)
    # $binary_remote_addr chiếm 4 bytes cho IPv4 (10MB lưu được ~160.000 IP đồng thời)
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=compute_heavy_limit:10m rate=3r/s;
    
    # Vùng nhớ giới hạn số kết nối đồng thời từ 1 địa chỉ IP
    limit_conn_zone $binary_remote_addr zone=ip_connection_limit:10m;
    limit_conn_status 429;
    limit_req_status 429;

    # --------------------------------------------------------------------------
    # 3. NÉN DỮ LIỆU GZIP TỐC ĐỘ CAO
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # 4. CHUYỂN HƯỚNG CỔNG 80 (HTTP) SANG CỔNG 443 (HTTPS)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Phục vụ xác thực chứng chỉ Let's Encrypt Certbot ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Chuyển hướng vĩnh viễn 301 toàn bộ traffic sang HTTPS cổng 443
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 5. MÁY CHỦ BẢO MẬT HTTPS CỔNG 443
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # Đường dẫn chứng chỉ SSL/TLS
        ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

        # Cấu hình SSL/TLS tiêu chuẩn bảo mật cao (A+ SSL Labs)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling giúp xác minh chứng chỉ nhanh hơn
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;

        # ----------------------------------------------------------------------
        # CÁC HEADER BẢO MẬT BẮT BUỘC (SECURITY HEADERS)
        # ----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Giới hạn tối đa 20 kết nối đồng thời từ 1 IP vào máy chủ
        limit_conn ip_connection_limit 20;

        # ----------------------------------------------------------------------
        # PROXY ROUTING: TÍNH TOÁN NẶNG (/api/compute)
        # Chặn DDoS riêng cho thuật toán giảm chiều 3D (PCA, t-SNE, UMAP)
        # ----------------------------------------------------------------------
        location /api/compute {
            limit_req zone=compute_heavy_limit burst=5 nodelay;

            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # PROXY ROUTING: API CHUNG (/api/)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general_limit burst=25 nodelay;

            proxy_pass http://127.0.0.1:5000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # FRONTEND VITE SPA STATIC / REVERSE PROXY
        # ----------------------------------------------------------------------
        location / {
            # Khi triển khai production file build tĩnh:
            root /var/www/explorer/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Caching tối ưu cho tài nguyên tĩnh
            location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable";
                access_log off;
            }
        }
    }
}

